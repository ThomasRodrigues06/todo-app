<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <header>
        <h1>Ma Todo List</h1>
    </header>

    <main>
        <section>
            <h2>Ajouter une tâche</h2>

            <form>
                <label for="task">Nouvelle tâche :</label>
                <input 
                    type="text" 
                    id="task" 
                    name="task" 
                    placeholder="Écris une tâche"
                >

                <button type="submit">Ajouter</button>
            </form>
        </section>

        <section>
            <h2>Mes tâches</h2>

            <ul id="task-list">
                <!-- Les tâches apparaîtront ici -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Todo App</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
